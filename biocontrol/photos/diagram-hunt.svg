<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#1a1a1a"/>
  <text x="640" y="66" text-anchor="middle" fill="#eaeaea" font-size="44" font-weight="700">How a half-millimetre worm kills a giant slug</text>

  <!-- SCALE CONTRAST -->
  <!-- Goliath: slug silhouette -->
  <path d="M120 250 q30 -70 150 -62 q150 8 230 8 q70 0 70 35 q0 40 -90 42 q-180 4 -300 6 q-70 1 -60 -29 z"
        fill="#caa46a" opacity="0.9"/>
  <line x1="135" y1="205" x2="120" y2="170" stroke="#caa46a" stroke-width="5" stroke-linecap="round"/>
  <line x1="170" y1="200" x2="165" y2="162" stroke="#caa46a" stroke-width="5" stroke-linecap="round"/>
  <text x="300" y="320" text-anchor="middle" fill="#f0a868" font-size="26" font-weight="600">GOLIATH</text>
  <text x="300" y="352" text-anchor="middle" fill="#bdbdbd" font-size="22">the Spanish slug · ~7 cm</text>

  <text x="640" y="270" text-anchor="middle" fill="#777" font-size="40" font-style="italic">vs</text>

  <!-- David: tiny dot under a magnifier -->
  <circle cx="900" cy="250" r="70" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="950" y1="300" x2="985" y2="335" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <path d="M878 250 q12 -9 24 0 q9 8 0 16 q-12 9 -24 0 q-8 -7 2 -14" fill="none" stroke="#7ec77e" stroke-width="3"/>
  <text x="900" y="360" text-anchor="middle" fill="#7ec77e" font-size="26" font-weight="600">DAVID</text>
  <text x="900" y="392" text-anchor="middle" fill="#bdbdbd" font-size="22">one aaltje · ~0.5 mm · invisible</text>
  <text x="900" y="420" text-anchor="middle" fill="#7ec77e" font-size="20">12 million of them = one little pack</text>

  <!-- FLOW -->
  <g font-size="22">
    <!-- step boxes -->
    <g>
      <rect x="60" y="470" width="206" height="190" rx="14" fill="#202020" stroke="#7ec77e" stroke-width="2"/>
      <text x="163" y="512" text-anchor="middle" fill="#7ec77e" font-size="26" font-weight="700">1 · HUNT</text>
      <text x="163" y="556" text-anchor="middle" fill="#dcdcdc">they swim through</text>
      <text x="163" y="584" text-anchor="middle" fill="#dcdcdc">moist soil, actively</text>
      <text x="163" y="612" text-anchor="middle" fill="#dcdcdc">seeking a slug</text>
    </g>
    <g>
      <rect x="306" y="470" width="206" height="190" rx="14" fill="#202020" stroke="#7ec77e" stroke-width="2"/>
      <text x="409" y="512" text-anchor="middle" fill="#7ec77e" font-size="26" font-weight="700">2 · ENTER</text>
      <text x="409" y="556" text-anchor="middle" fill="#dcdcdc">slip in through a</text>
      <text x="409" y="584" text-anchor="middle" fill="#dcdcdc">natural body</text>
      <text x="409" y="612" text-anchor="middle" fill="#dcdcdc">opening</text>
    </g>
    <g>
      <rect x="552" y="470" width="206" height="190" rx="14" fill="#202020" stroke="#7ec77e" stroke-width="2"/>
      <text x="655" y="512" text-anchor="middle" fill="#7ec77e" font-size="26" font-weight="700">3 · INFECT</text>
      <text x="655" y="556" text-anchor="middle" fill="#dcdcdc">release a bacterium;</text>
      <text x="655" y="584" text-anchor="middle" fill="#dcdcdc">the slug stops</text>
      <text x="655" y="612" text-anchor="middle" fill="#dcdcdc">eating in days</text>
    </g>
    <g>
      <rect x="798" y="470" width="206" height="190" rx="14" fill="#202020" stroke="#ff6b6b" stroke-width="2"/>
      <text x="901" y="512" text-anchor="middle" fill="#ff6b6b" font-size="26" font-weight="700">4 · DIE</text>
      <text x="901" y="556" text-anchor="middle" fill="#dcdcdc">the slug dies</text>
      <text x="901" y="584" text-anchor="middle" fill="#dcdcdc">underground, in</text>
      <text x="901" y="612" text-anchor="middle" fill="#dcdcdc">about a week</text>
    </g>
    <g>
      <rect x="1044" y="470" width="176" height="190" rx="14" fill="#202020" stroke="#7ec77e" stroke-width="2"/>
      <text x="1132" y="512" text-anchor="middle" fill="#7ec77e" font-size="26" font-weight="700">5 · BREED</text>
      <text x="1132" y="556" text-anchor="middle" fill="#dcdcdc">they multiply</text>
      <text x="1132" y="584" text-anchor="middle" fill="#dcdcdc">inside, then hunt</text>
      <text x="1132" y="612" text-anchor="middle" fill="#dcdcdc">the next one</text>
    </g>
    <!-- arrows -->
    <g fill="#777">
      <text x="286" y="572" text-anchor="middle" font-size="34">&#8594;</text>
      <text x="532" y="572" text-anchor="middle" font-size="34">&#8594;</text>
      <text x="778" y="572" text-anchor="middle" font-size="34">&#8594;</text>
      <text x="1024" y="572" text-anchor="middle" font-size="34">&#8594;</text>
    </g>
  </g>
</svg>
